<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Glowing Drop Shadow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Pulse and Orbit Keyframe Animations -->
    <style>
      @keyframes neon-pulse {
        0%, 100% { opacity: 0.25; filter: drop-shadow(0 0 1px #00FF66); }
        50% { opacity: 0.95; filter: drop-shadow(0 0 12px #00FF66); }
      }
      @keyframes core-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.05; }
        100% { transform: translateY(340px); opacity: 0.15; }
      }
      @keyframes connection-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      
      .neon-line { stroke: #00FF66; stroke-width: 1.5; opacity: 0.6; }
      .glowing-core { fill: none; stroke: #00FF66; stroke-width: 2.5; filter: url(#neon-glow); transform-origin: 200px 170px; animation: core-spin 25s linear infinite; }
      .core-ring { fill: none; stroke: #00441b; stroke-width: 1; stroke-dasharray: 5, 5; transform-origin: 200px 170px; animation: core-spin 15s linear infinite reverse; }
      .flowing-signal { stroke: #00FF66; stroke-width: 1.5; stroke-dasharray: 8, 12; animation: connection-flow 2s linear infinite; filter: url(#neon-glow); }
      .active-node { fill: #00FF66; filter: url(#neon-glow); animation: neon-pulse 3s infinite ease-in-out; }
      .terminal-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Courier, monospace; fill: #00FF66; font-size: 14px; letter-spacing: 1px; }
      .terminal-dim { font-family: "SFMono-Regular", Consolas, monospace; fill: #888888; font-size: 12px; }
      .accent-pink { fill: #FF007F; filter: drop-shadow(0 0 3px #FF007F); }
      .cyber-scanline { fill: none; stroke: #00FF66; stroke-width: 1; opacity: 0.1; animation: scanline 6s linear infinite; }
    </style>
  </defs>

  <!-- Background Base (Transparent to blend with github dark theme) -->
  <rect width="1000" height="340" fill="none"/>

  <!-- Cyber Grid background grid lines -->
  <g opacity="0.08">
    <path d="M 0,0 L 1000 0 M 0,34 L 1000 34 M 0,68 L 1000 68 M 0,102 L 1000 102 M 0,136 L 1000 136 M 0,170 L 1000 170 M 0,204 L 1000 204 M 0,238 L 1000 238 M 0,272 L 1000 272 M 0,306 L 1000 306 M 0,340 L 1000 340" stroke="#00FF66" stroke-width="0.5"/>
    <path d="M 0,0 L 0 340 M 100,0 L 100 340 M 200,0 L 200 340 M 300,0 L 300 340 M 400,0 L 400 340 M 500,0 L 500 340 M 600,0 L 600 340 M 700,0 L 700 340 M 800,0 L 800 340 M 900,0 L 900 340 M 1000,0 L 1000 340" stroke="#00FF66" stroke-width="0.5"/>
  </g>

  <!-- Cyber Scanline -->
  <line x1="0" y1="0" x2="1000" y2="0" class="cyber-scanline" />

  <!-- Neural AI Network Topology Graphic on Left Panel (200, 170 is core) -->
  <g>
    <!-- Background concentric rings -->
    <circle cx="200" cy="170" r="100" class="core-ring"/>
    <circle cx="200" cy="170" r="60" class="core-ring" style="stroke-dasharray: 10, 4; animation-duration: 8s;"/>
    
    <!-- Outer connected nodes with flowing signals -->
    <line x1="200" y1="170" x2="330" y2="90" class="neon-line"/>
    <line x1="200" y1="170" x2="120" y2="80" class="neon-line"/>
    <line x1="200" y1="170" x2="80" y2="210" class="neon-line"/>
    <line x1="200" y1="170" x2="280" y2="260" class="neon-line"/>
    
    <!-- Flowing animated signals -->
    <line x1="200" y1="170" x2="330" y2="90" class="flowing-signal"/>
    <line x1="200" y1="170" x2="80" y2="210" class="flowing-signal" style="animation-delay: -0.5s;"/>
    <line x1="200" y1="170" x2="280" y2="260" class="flowing-signal" style="animation-delay: -1.2s;"/>

    <!-- Rotating glowing cyber core -->
    <polygon points="200,140 225,185 175,185" class="glowing-core"/>
    <polygon points="200,200 175,155 225,155" class="glowing-core" style="animation-duration: 12s; stroke: #FF007F;"/>

    <!-- Glowing Node Terminals -->
    <circle cx="330" cy="90" r="6" class="active-node"/>
    <circle cx="120" cy="80" r="4" class="active-node" style="animation-delay: -1s;"/>
    <circle cx="80" cy="210" r="5" class="active-node" style="animation-delay: -2s;"/>
    <circle cx="280" cy="260" r="7" class="active-node" style="animation-delay: -0.5s;"/>
    <circle cx="200" cy="170" r="9" class="active-node" style="animation-duration: 4s; fill: #00E88A;"/>
  </g>

  <!-- Monospace Code Terminal Interface on Right Panel (starts x=430) -->
  <g transform="translate(430, 45)">
    <!-- Diagnostic lines -->
    <text x="0" y="20" class="terminal-text" xml:space="preserve">> ETERULTIMATE SYSTEM INTERFACE [v1.0.6]</text>
    <text x="0" y="45" class="terminal-dim" xml:space="preserve">-----------------------------------------------------</text>
    <text x="0" y="70" class="terminal-text" xml:space="preserve">> SYSTEM HOSTNAME: <tspan class="accent-pink">github.com/EterUltimate</tspan></text>
    <text x="0" y="95" class="terminal-text" xml:space="preserve">> COGNITIVE PROTOCOL: <tspan fill="#00E88A">ACTIVE (ASYNC_RUN)</tspan></text>
    <text x="0" y="120" class="terminal-text" xml:space="preserve">> DEPLOYED INSTANCES: <tspan fill="#00E88A">ASTRBOT (ABD)</tspan></text>
    
    <!-- Code display mockup -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="510" height="90" rx="4" fill="#050505" stroke="#1A1A1A" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#FF5F56"/>
      <circle cx="27" cy="15" r="4" fill="#FFBD2E"/>
      <circle cx="39" cy="15" r="4" fill="#27C93F"/>
      <text x="15" y="42" class="terminal-dim" font-size="11" xml:space="preserve">import asyncio, astrbot</text>
      <text x="15" y="60" class="terminal-text" font-size="11" xml:space="preserve" fill="#00FF66">async def main():</text>
      <text x="15" y="78" class="terminal-text" font-size="11" xml:space="preserve" fill="#00FF66">    await astrbot.matrix.boot(protocol="cybernetic_core")</text>
    </g>
  </g>
</svg>