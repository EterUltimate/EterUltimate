<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Glowing Drop Shadow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Hover and pulse animations -->
    <style>
      @keyframes core-pulse {
        0%, 100% { fill-opacity: 0.2; filter: drop-shadow(0 0 1px #00FF66); }
        50% { fill-opacity: 0.8; filter: drop-shadow(0 0 10px #00FF66); }
      }
      @keyframes signal-dash {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      
      .cyber-border { stroke: #00FF66; stroke-width: 1.5; opacity: 0.7; fill: none; }
      .cyber-sub-border { stroke: #1a5c2d; stroke-width: 1; fill: none; }
      .text-title { font-family: "SFMono-Regular", Consolas, monospace; fill: #00FF66; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
      .text-body { font-family: "SFMono-Regular", Consolas, monospace; fill: #888888; font-size: 12px; line-height: 1.6; }
      .text-bold { font-family: "SFMono-Regular", Consolas, monospace; fill: #ffffff; font-size: 13px; font-weight: bold; }
      
      /* Interactive hover styles */
      .clickable-block {
        transition: transform 0.3s ease, filter 0.3s ease;
        cursor: pointer;
      }
      .clickable-block:hover {
        transform: translate(5px, 0);
        filter: drop-shadow(0 0 8px rgba(0,255,102,0.6));
      }
      .clickable-block:hover .neon-highlight {
        fill: #00FF66;
      }
      
      .neon-highlight { fill: #009933; transition: fill 0.3s ease; }
      .pulse-led { fill: #00FF66; filter: url(#neon-glow); animation: core-pulse 3s infinite ease-in-out; }
      .circuit-line { stroke: #00441b; stroke-width: 1.5; fill: none; }
      .circuit-signal { stroke: #00FF66; stroke-width: 1.5; stroke-dasharray: 8, 12; fill: none; animation: signal-dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Solid Dark Charcoal Background -->
  <rect width="1000" height="360" fill="#000000" />

  <!-- Grid Overlay -->
  <g opacity="0.04">
    <path d="M 0,0 L 1000 0 M 0,36 L 1000 36 M 0,72 L 1000 72 M 0,108 L 1000 108 M 0,144 L 1000 144 M 0,180 L 1000 180 M 0,216 L 1000 216 M 0,252 L 1000 252 M 0,288 L 1000 288 M 0,324 L 1000 324" stroke="#00FF66" stroke-width="0.5"/>
    <path d="M 0,0 L 0 360 M 100,0 L 100 360 M 200,0 L 200 360 M 300,0 L 300 360 M 400,0 L 400 360 M 500,0 L 500 360 M 600,0 L 600 360 M 700,0 L 700 360 M 800,0 L 800 360 M 900,0 L 900 360" stroke="#00FF66" stroke-width="0.5"/>
  </g>

  <!-- Outer Cyber-Terminal Border with cut corners -->
  <path d="M 15,30 L 985 30 L 985 330 L 970 345 L 15 345 Z" class="cyber-border" />
  <path d="M 10,25 L 990 25 L 990 325 L 975 350 L 10 350 Z" class="cyber-sub-border" stroke-dasharray="50, 15, 10, 15" />

  <!-- Section Title -->
  <text x="35" y="55" class="text-title">&gt; ACTIVE_SUB_SYSTEMS</text>
  <line x1="35" y1="65" x2="230" y2="65" stroke="#00FF66" stroke-width="1.5" opacity="0.8"/>

  <!-- LEFT PANEL: Schematic Visual Representation (Motherboard/Pipe Core) -->
  <g transform="translate(10, 0)">
    <!-- Circuit lines -->
    <path d="M 100,200 L 200,200 L 250,150 L 320,150" class="circuit-line" />
    <path d="M 200,200 L 250,250 L 320,250" class="circuit-line" />
    
    <!-- Animated flowing signals -->
    <path d="M 100,200 L 200,200 L 250,150 L 320,150" class="circuit-signal" />
    <path d="M 200,200 L 250,250 L 320,250" class="circuit-signal" style="animation-delay: -1s;" />

    <!-- Core chip mockup -->
    <rect x="50" y="150" width="100" height="100" fill="#050505" stroke="#00FF66" stroke-width="2" rx="4" filter="url(#neon-glow)" />
    <!-- Glowing core LED -->
    <rect x="75" y="175" width="50" height="50" rx="3" class="pulse-led" />
    <text x="77" y="205" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#000000" font-weight="bold">AI_CORE</text>

    <!-- Node circles -->
    <circle cx="320" cy="150" r="5" class="pulse-led" />
    <circle cx="320" cy="250" r="5" class="pulse-led" style="animation-delay: -0.7s; fill: #FF007F;" />
    
    <!-- Schematic labeling -->
    <text x="50" y="275" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#888888">BUS: ASYNC_IO</text>
    <text x="50" y="290" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#888888">SYS_LOAD: SECURE</text>
  </g>

  <!-- RIGHT PANEL: Clickable Subsystem Blocks -->
  <g transform="translate(420, 80)">

    <!-- Subsystem 1: AstrBot (ABD) -->
    <a xlink:href="https://github.com/EterUltimate/ABD" target="_blank">
      <g class="clickable-block">
        <!-- Accent indicator bar -->
        <rect x="0" y="0" width="6" height="55" class="neon-highlight" />
        <text x="20" y="18" class="text-bold" fill="#00FF66">&gt; AstrBot (ABD) [Core Matrix]</text>
        <text x="20" y="36" class="text-body">Asynchronous loosely-coupled chatbot &amp; AI Agent framework</text>
        <text x="20" y="50" class="text-body" fill="#00AA44">Engine: Python asyncio // Pluggable multi-platform bridge</text>
      </g>
    </a>

    <!-- Subsystem 2: EterUeeFlutter -->
    <a xlink:href="https://github.com/EterUltimate/EterUeeFlutter" target="_blank">
      <g class="clickable-block" transform="translate(0, 80)">
        <rect x="0" y="0" width="6" height="55" class="neon-highlight" style="fill: #00FF66;" />
        <text x="20" y="18" class="text-bold">&gt; EterUeeFlutter [Companion App]</text>
        <text x="20" y="36" class="text-body">Modern, beautiful Flutter client companion for the AI matrix</text>
        <text x="20" y="50" class="text-body" fill="#00AA44">Platform: Flutter / Dart // High-performance fluid GUI</text>
      </g>
    </a>

    <!-- Subsystem 3: astrbot-mcp -->
    <a xlink:href="https://github.com/EterUltimate/astrbot-mcp" target="_blank">
      <g class="clickable-block" transform="translate(0, 160)">
        <rect x="0" y="0" width="6" height="55" class="neon-highlight" />
        <text x="20" y="18" class="text-bold" fill="#FF007F">&gt; astrbot-mcp [Protocol Node]</text>
        <text x="20" y="36" class="text-body">Model Context Protocol (MCP) server suite for tool integration</text>
        <text x="20" y="50" class="text-body" fill="#00AA44">Interface: MCP Spec // Seamless sandboxed tool operations</text>
      </g>
    </a>

  </g>
</svg>