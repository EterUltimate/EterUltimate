<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <!-- Glowing Drop Shadow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <style>
      .cyber-border { stroke: #00FF66; stroke-width: 1.5; opacity: 0.7; fill: none; }
      .cyber-sub-border { stroke: #1a5c2d; stroke-width: 1; fill: none; }
      .text-title { font-family: "SFMono-Regular", Consolas, monospace; fill: #00FF66; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
      .text-port { font-family: "SFMono-Regular", Consolas, monospace; fill: #ffffff; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
      .text-label { font-family: "SFMono-Regular", Consolas, monospace; fill: #888888; font-size: 12px; }
      
      /* Glassmorphic button styling & hover animations */
      .glass-btn {
        fill: #050505;
        stroke: #1a5c2d;
        stroke-width: 1.5;
        transition: stroke 0.3s ease, fill 0.3s ease, filter 0.3s ease;
        cursor: pointer;
      }
      .port-button {
        cursor: pointer;
      }
      .port-button:hover .glass-btn {
        stroke: #00FF66;
        fill: #0a1c0f;
        filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.5));
      }
      .port-button:hover .text-port {
        fill: #00FF66;
        filter: drop-shadow(0 0 3px rgba(0, 255, 102, 0.8));
      }
      .port-button:hover .text-label {
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Solid Dark Charcoal Background -->
  <rect width="1000" height="180" fill="#000000" />

  <!-- Grid Overlay -->
  <g opacity="0.04">
    <path d="M 0,0 L 1000 0 M 0,30 L 1000 30 M 0,60 L 1000 60 M 0,90 L 1000 90 M 0,120 L 1000 120 M 0,150 L 1000 150 M 0,180 L 1000 180" stroke="#00FF66" stroke-width="0.5"/>
    <path d="M 0,0 L 0 180 M 100,0 L 100 180 M 200,0 L 200 180 M 300,0 L 300 180 M 400,0 L 400 180 M 500,0 L 500 180 M 600,0 L 600 180 M 700,0 L 700 180 M 800,0 L 800 180 M 900,0 L 900 180" stroke="#00FF66" stroke-width="0.5"/>
  </g>

  <!-- Outer Cyber-Terminal Border with cut corners -->
  <path d="M 15,15 L 985 15 L 985 150 L 970 165 L 15 165 Z" class="cyber-border" />
  <path d="M 10,10 L 990 10 L 990 145 L 975 170 L 10 170 Z" class="cyber-sub-border" stroke-dasharray="100, 15, 10, 15" />

  <!-- Section Title -->
  <text x="35" y="40" class="text-title">&gt; NETWORK_PORTS // CONTACT_CHANNELS</text>
  <line x1="35" y1="50" x2="380" y2="50" stroke="#00FF66" stroke-width="1.5" opacity="0.8"/>

  <!-- HORIZONTAL BUTTONS GRID (Total 3 buttons, spaced evenly) -->
  
  <!-- Button 1: PORT 0x22 (Email) -->
  <a xlink:href="mailto:eterultimate@agent.qq.com">
    <g class="port-button" transform="translate(35, 75)">
      <rect x="0" y="0" width="280" height="65" rx="5" class="glass-btn" />
      <text x="20" y="28" class="text-port">PORT 0x22 [SSH]</text>
      <text x="20" y="48" class="text-label">eterultimate@agent.qq.com</text>
    </g>
  </a>

  <!-- Button 2: PORT 0x80 (GitHub Profile) -->
  <a xlink:href="https://github.com/EterUltimate">
    <g class="port-button" transform="translate(360, 75)">
      <rect x="0" y="0" width="280" height="65" rx="5" class="glass-btn" />
      <text x="20" y="28" class="text-port">PORT 0x80 [HTTP]</text>
      <text x="20" y="48" class="text-label">github.com/EterUltimate</text>
    </g>
  </a>

  <!-- Button 3: PORT 0x443 (AstrBot Docs) -->
  <a xlink:href="https://docs.astrbot.app" target="_blank">
    <g class="port-button" transform="translate(685, 75)">
      <rect x="0" y="0" width="280" height="65" rx="5" class="glass-btn" />
      <text x="20" y="28" class="text-port" style="fill: #FF007F;">PORT 0x443 [HTTPS]</text>
      <text x="20" y="48" class="text-label">docs.astrbot.app</text>
    </g>
  </a>
</svg>